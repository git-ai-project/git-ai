name: Git Core Compatibility

permissions:
  contents: read

env:
  GIT_COMPAT_URL: https://github.com/git/git.git
  GIT_COMPAT_REF: v2.54.0
  GIT_COMPAT_SHA: 94f057755b7941b321fd11fec1b2e3ca5313a4e0
  GIT_COMPAT_CLEAN_SOURCE: "1"

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Taskfile.yml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/git-core-compat.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Taskfile.yml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/git-core-compat.yml'
  merge_group:
    branches: [main]

jobs:
  git-core-tests:
    name: Run core Git tests with git-ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Cache git source
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/git-core-tests
          key: git-source-${{ runner.os }}-${{ env.GIT_COMPAT_SHA }}

      - name: Clone git source
        run: |
          set -euo pipefail
          if [ -L /tmp/git-core-tests ]; then
            echo "::error::/tmp/git-core-tests is a symlink"
            exit 1
          fi
          if [ -L /tmp/git-core-tests/.git ]; then
            echo "::error::/tmp/git-core-tests/.git is a symlink"
            exit 1
          fi
          if [ ! -d /tmp/git-core-tests/.git ]; then
            if [ -e /tmp/git-core-tests ]; then
              echo "::error::/tmp/git-core-tests exists but is not a Git checkout"
              exit 1
            fi
            git clone --depth 1 --branch "$GIT_COMPAT_REF" "$GIT_COMPAT_URL" /tmp/git-core-tests
          else
            echo "Using cached git source"
          fi

          if git -C /tmp/git-core-tests remote get-url origin >/dev/null 2>&1; then
            git -C /tmp/git-core-tests remote set-url origin "$GIT_COMPAT_URL"
          else
            git -C /tmp/git-core-tests remote add origin "$GIT_COMPAT_URL"
          fi
          git -C /tmp/git-core-tests fetch --depth 1 origin "$GIT_COMPAT_REF"
          git -C /tmp/git-core-tests checkout --force --detach FETCH_HEAD

          actual_sha="$(git -C /tmp/git-core-tests rev-parse HEAD)"
          if [ "$actual_sha" != "$GIT_COMPAT_SHA" ]; then
            echo "::error::Expected $GIT_COMPAT_REF to resolve to $GIT_COMPAT_SHA, got $actual_sha"
            exit 1
          fi

          git -C /tmp/git-core-tests reset --hard "$GIT_COMPAT_SHA"
          git -C /tmp/git-core-tests clean -ffdx
          git -C /tmp/git-core-tests rev-parse HEAD
          git -C /tmp/git-core-tests describe --tags --always --dirty

      - name: Install pinned Git for compatibility tests
        run: |
          set -euo pipefail
          # test-lib.sh changes HOME, so git-ai also needs its normal fallback
          # location to contain the same Git version as the pinned test suite.
          make -C /tmp/git-core-tests -j"$(nproc)" prefix=/usr/local NO_CURL=YesPlease NO_GETTEXT=YesPlease
          sudo make -C /tmp/git-core-tests prefix=/usr/local NO_CURL=YesPlease NO_GETTEXT=YesPlease install
          hash -r
          test "$(command -v git)" = /usr/local/bin/git
          test "$(git --version)" = "$(/tmp/git-core-tests/git --version)"
          test "$(git --exec-path)" = /usr/local/libexec/git-core
          test -x /usr/local/libexec/git-core/git-upload-pack

      - name: Build git-ai
        run: cargo build --release --bin git-ai

      - name: Verify git-ai uses pinned Git without a config
        run: |
          set -euo pipefail
          compat_home="$(mktemp -d)"
          trap 'rm -rf "$compat_home"' EXIT
          expected_version="$(/tmp/git-core-tests/git --version)"
          actual_version="$(env HOME="$compat_home" _GITAI_INTERNAL_DISABLE_WRAPPER_DAEMON_AUTOSPAWN=1 bash -c 'exec -a git ./target/release/git-ai --version')"
          printf 'Pinned Git: %s\nGit AI proxy: %s\n' "$expected_version" "$actual_version"
          test "$actual_version" = "$expected_version"

      - name: Run core Git compatibility tests
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        # The checkout was already cleaned and the matching Git build installed.
        run: python3 tests/git-compat/run-core-tests.py --no-clean-git-source

      - name: Clean git source before cache save
        run: |
          set -euo pipefail
          if [ -L /tmp/git-core-tests ] || [ -L /tmp/git-core-tests/.git ] || [ ! -d /tmp/git-core-tests/.git ]; then
            echo "::error::/tmp/git-core-tests is not a normal Git checkout"
            exit 1
          fi
          git -C /tmp/git-core-tests reset --hard "$GIT_COMPAT_SHA"
          git -C /tmp/git-core-tests clean -ffdx
